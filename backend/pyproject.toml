    "langchain-groq>=1.1.2",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.34.0",
]

